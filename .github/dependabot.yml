version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
          patterns:
              - '*'

  - package-ecosystem: pip
    directories:
      - "/compare_pdfs"
      - "/convert_intro_to_md"
      - "/convert_source_description"
      - "/create_glyph_subset"
      - "/unify_ids"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    allow:
      - dependency-type: "all"
    groups:
      # One PR per dependency across all directories instead of one per directory
      pip:
          group-by: dependency-name
          patterns:
              - '*'
