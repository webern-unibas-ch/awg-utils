version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # the codeql sub-actions only work in matching versions, so always update them together
      github/codeql-action:
          patterns:
              - 'github/codeql-action/*'
      # minor and patch updates of all other actions in one PR, major updates separately
      # (scorecards and visualize-repo only run on main, so PR checks don't cover them)
      github-actions:
          patterns:
              - '*'
          update-types:
              - 'minor'
              - 'patch'

  - package-ecosystem: pip
    directories:
      - "/compare_pdfs"
      - "/convert_intro_to_md"
      - "/convert_source_description"
      - "/create_glyph_subset"
      - "/unify_ids"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    allow:
      - dependency-type: "all"
    groups:
      # One PR per dependency across all directories instead of one per directory
      pip:
          group-by: dependency-name
          patterns:
              - '*'
