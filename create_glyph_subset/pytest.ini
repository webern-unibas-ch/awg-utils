# pytest.ini configuration for create_glyph_subset test suite

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --disable-warnings
    --cov=create_glyph_subset
    --cov=utils
    --cov-report=term-missing
    --cov-report=html:htmlcov
