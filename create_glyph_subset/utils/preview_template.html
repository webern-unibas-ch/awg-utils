<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>AWG Edition Glyphs</title>
        <style>
            @font-face {
                font-family: 'AWG Edition Glyphs Preview';
                src: url(data:font/woff2;base64,$font_base64) format('woff2');
            }
            :root {
                --bg: #f7f6f3;
                --surface: #ffffff;
                --text: #1d1d1b;
                --muted: #6b6a66;
                --border: #e2e0da;
                --accent: #8a1c2b;
                --ok: #2f6b3a;
                --bad: #b3261e;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme='light']) {
                    --bg: #161615;
                    --surface: #20201e;
                    --text: #ecebe7;
                    --muted: #a09f9a;
                    --border: #34332f;
                    --accent: #e07a86;
                    --ok: #7ccf8a;
                    --bad: #ff8a80;
                }
            }
            :root[data-theme='dark'] {
                --bg: #161615;
                --surface: #20201e;
                --text: #ecebe7;
                --muted: #a09f9a;
                --border: #34332f;
                --accent: #e07a86;
                --ok: #7ccf8a;
                --bad: #ff8a80;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 32px 16px 64px;
                background: var(--bg);
                color: var(--text);
                font: 15px/1.5 Georgia, 'Times New Roman', serif;
            }
            main {
                max-width: 1040px;
                margin: 0 auto;
            }
            h1 {
                font-size: 28px;
                margin: 0 0 4px;
            }
            h2 {
                font-size: 13px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--muted);
                margin: 36px 0 12px;
            }
            .sub {
                color: var(--muted);
                margin: 0 0 20px;
            }
            dl {
                display: grid;
                grid-template-columns: max-content 1fr;
                gap: 4px 16px;
                margin: 0;
                padding: 16px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                font-size: 14px;
            }
            dt {
                color: var(--muted);
            }
            dd {
                margin: 0;
                overflow-wrap: anywhere;
            }
            .status {
                font-weight: bold;
                color: var(--ok);
            }
            .status.bad {
                color: var(--bad);
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }
            .card {
                margin: 0;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .card.missing {
                border-color: var(--bad);
            }
            .glyph {
                font-family: 'AWG Edition Glyphs Preview';
                font-size: 56px;
                line-height: 1;
                height: 120px;
                display: flex;
                align-items: center;
                justify-content: center;
                white-space: pre;
            }
            figcaption {
                border-top: 1px solid var(--border);
                padding: 8px 10px;
                display: flex;
                flex-direction: column;
                gap: 2px;
            }
            .key {
                font: 12px/1.3 ui-monospace, Consolas, monospace;
                color: var(--accent);
                overflow-wrap: anywhere;
            }
            .meta {
                font-size: 12px;
                color: var(--muted);
            }
            .sample {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 16px;
                font-size: 18px;
            }
            .sample .g {
                font-family: 'AWG Edition Glyphs Preview';
            }
        </style>
    </head>
    <body>
        <main>
            <h1>$family</h1>
            <p class="sub">$note</p>
            <dl>
                <dt>Family / style</dt>
                <dd>$family / $style</dd>
                <dt>PostScript name</dt>
                <dd>$postscript_name</dd>
                <dt>Version</dt>
                <dd>$version</dd>
                <dt>File</dt>
                <dd>$font_file ($font_size bytes)</dd>
                <dt>Codepoints</dt>
                <dd><span class="$status_class">$found / $total in cmap</span></dd>
            </dl>
            $sections
            <h2>Inline sample</h2>
            <p class="sample">Running text with glyphs $sample to check size and baseline next to the text font.</p>
        </main>
    </body>
</html>
